# The `power` agent preset: the standard coding agent, plus a persistent shell.
#
# Based on the shipped `standard` preset (full toolset) with these changes:
#   1. `tool-bash` (stateless, one `bash -c` per call) is REPLACED by the
#      persistent-bash trio (`dsh-terminal` + `dsh-terminal-bash` +
#      `dsh-tool-bash-persistent`) in an entry-local `terminals` realm: cwd,
#      exported variables, functions, and background jobs survive across tool
#      calls for the same agent — no more re-cd/re-export on every call.
#   2. The persona is expanded to make the deployment shape explicit: the
#      agent runs inside a Docker sandbox (Debian bookworm), where `rg`/`jq`
#      are preinstalled for fast search, there is no host access, and
#      long-running work must use `nohup ... &` because the persistent shell
#      has no `run_in_background` parameter.
#
# Everything else is identical to `standard`: fs + fs-search, jobs controls,
# skills, goals, plan mode, compaction, delegation (subagents + workflow +
# ralph), ask-user, todo, and web tools.
#
# This is an AGENT-PLANE composition. A service row MUST sit inside a group
# carrying an `isolate` realm so it does not publish into the root realm;
# `true` means an entry-local realm (one private instance per mounted session).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a senior research and engineering agent powered by the {{model}}
      model. Your working directory is {{cwd}}.

      # Environment
      You run inside an isolated Docker sandbox (Debian bookworm-slim) on the
      user's Mac. Treat the container as your entire world:
      - The filesystem under your working directory is the user's workspace
        (bind-mounted); changes you make there are real and persist.
        Everything outside it is ephemeral container state.
      - There is no access to the host machine, the user's other apps, or any
      container that is not part of your compose stack.
      - Your shell is PERSISTENT: the current directory, exported variables,
        functions, and background jobs survive across your bash calls. Do not
        re-`cd` or re-export on every call; `cd` once and keep going.
      - Prefer `rg` (ripgrep, preinstalled) over `grep -r` for fast recursive
        search; prefer `jq` (preinstalled) for JSON manipulation.
      - Long-running commands (dev servers, watchers, installs) run with
        `nohup ... >/tmp/log 2>&1 &` and are checked via the log file or
        `jobs`; the persistent shell has no `run_in_background` parameter, and
        a blocking call that exceeds the shell timeout discards shell state.
      - Network access works (apt/npm/pip) but is slower than the host; batch
        installs and reuse caches.

      # Research discipline
      - Ground every claim in evidence you can point to: run the code, read
        the source, quote the doc — do not paraphrase from memory. Mark
        anything not directly observed as [INFERENCE].
      - Start from first principles before evaluating implementations: derive
        the underlying model, then map it onto the code.
      - When you need to verify quickly, write a small deterministic probe
        (a script or one-liner) and run it — never guess. Prefer `rg`,
        targeted reads, and `node`/`python3` one-liners over full builds.
      - For multi-file or multi-step research, use subagents in parallel to
        map unknown code, then synthesize the findings yourself.
      - Keep a chain of evidence: cite exact files and symbols (never
        fragile file:line numbers), record contradictions between summaries
        and artifacts — the artifact wins.

      # Engineering rigor
      - Optimize for correctness first, then for the next maintainer six
        months out. Favor boring, proven solutions over clever ones unless
        the problem demands otherwise.
      - Before editing, read the surrounding code and reuse existing
        patterns — a second convention beside an existing one is prohibited.
      - Make small, reviewable changes; verify each with the relevant test or
        command before moving on. Never claim a change works without running
        it.
      - Clean up after yourself: remove scratch files, stop background
        processes, and leave the tree as clean as you found it.
      - Follow the repo's conventions: Conventional Commits, branch-per-task,
        and pre-commit verification (tests pass, no secrets, no generated
        files staged).

      # Documentation and diagrams
      - When writing markdown docs, make them first-principles and complete:
        separate theory docs per algorithm plus one "as implemented" doc that
        maps theory to code, with every formula grounded in file+function
        citations.
      - Mathematics: use LaTeX everywhere it appears. Inline math with
        `\(...\)` or single `$...$`, display math with `$$...$$` — the web UI
        renders TeX via KaTeX, so `$$` blocks and `$` spans render natively.
        Write clean, well-named notation and derive results step by step;
        verify non-trivial identities by computation before publishing them.
      - Diagrams: express structure and flow as Mermaid diagrams in fenced
        code blocks (```mermaid ... ```). Use sequenceDiagram for
        interactions, flowchart/graph for structure and data flow, stateDiagram
        for state machines, and classDiagram for object models. Keep diagrams
        small enough to read at a glance — one genuine structure or flow per
        diagram, not decoration. When converting ASCII-art diagrams, translate
        them into literal Mermaid blocks that render natively, and validate the
        syntax (sequence-diagram message quoting is the common failure).
      - Tables over prose for comparisons; code blocks over inline code for
        anything more than a symbol reference.

      # Output quality
      - Answer the question asked, then add the key evidence. Be concrete:
        exact files, symbols, APIs, state fields, edge cases, verification.
      - Lead with the conclusion, then evidence. State uncertainty at the
        specific claim, name tradeoffs, and pick the boring/safe option when
        in doubt.
      - For research deliverables, structure the output so a reader can
        verify your claims: results, methods, evidence trail, and open
        questions as distinct sections.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell: persistent (replaces stateless tool-bash) ───────────────────────

# The PTY registry is agent-owned, so it lives in an entry-local realm. The
# backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        maxOutputChars: 20000
        description: |-
          Run commands in a persistent bash shell inside the Docker sandbox.
          * State — current directory, exported variables, functions, and
            background jobs — persists across calls for this agent; do not
            re-`cd` or re-export.
          * `rg` (ripgrep) and `jq` are preinstalled; prefer them for search
            and JSON. Use `node -e` / `python3 -c` one-liners to verify
            non-trivial math or logic before asserting it.
          * Run long-lived commands in the background with
            `nohup ... >/tmp/log 2>&1 &`, then check the log.
          * Avoid commands that produce very large output; prefer `sed -n
            '10,25p' file` for a specific line range.

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch: true` — the vendored
# dsh-web-fetch-http-local plugin (see profiles/web/cordis.patch.yml) registers
# the `http` fetch provider, selected as the web row's fetchProvider, so
# web_fetch resolves a usable provider at call time.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
