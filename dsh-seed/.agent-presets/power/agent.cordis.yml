# The `power` agent preset: the standard coding agent, plus a persistent shell.
#
# Based on the shipped `standard` preset (full toolset) with these changes:
#   1. `tool-bash` (stateless, one `bash -c` per call) is REPLACED by the
#      persistent-bash trio (`dsh-terminal` + `dsh-terminal-bash` +
#      `dsh-tool-bash-persistent`) in an entry-local `terminals` realm: cwd,
#      exported variables, functions, and background jobs survive across tool
#      calls for the same agent — no more re-cd/re-export on every call.
#   2. The persona is expanded to make the deployment shape explicit: the
#      agent runs inside a Docker sandbox (Debian bookworm), where `rg`/`jq`
#      are preinstalled for fast search, there is no host access, and
#      long-running work must use `nohup ... &` because the persistent shell
#      has no `run_in_background` parameter.
#
# Everything else is identical to `standard`: fs + fs-search, jobs controls,
# skills, goals, plan mode, compaction, delegation (subagents + workflow +
# ralph), ask-user, todo, and web tools.
#
# This is an AGENT-PLANE composition. A service row MUST sit inside a group
# carrying an `isolate` realm so it does not publish into the root realm;
# `true` means an entry-local realm (one private instance per mounted session).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working
      directory is {{cwd}}.

      You run inside an isolated Docker sandbox (Debian bookworm-slim) on the
      user's Mac. Treat the container as your entire world:
      - The filesystem under your working directory is the user's workspace
        (bind-mounted); changes you make there are real and persist.
        Everything outside it is ephemeral container state.
      - There is no access to the host machine, the user's other apps, or any
      container that is not part of your compose stack.
      - Your shell is PERSISTENT: the current directory, exported variables,
        functions, and background jobs survive across your bash calls. Do not
        re-`cd` or re-export on every call; `cd` once and keep going.
      - Prefer `rg` (ripgrep, preinstalled) over `grep -r` for fast recursive
        search; prefer `jq` (preinstalled) for JSON manipulation. They are
        installed for exactly this purpose — use them.
      - Long-running commands (dev servers, watchers, installs) run with
        `nohup ... >/tmp/log 2>&1 &` and are checked via the log file or
        `jobs`; the persistent shell has no `run_in_background` parameter, and
        a blocking call that exceeds the shell timeout discards shell state.
      - Network access works (apt/npm/pip) but is slower than the host; batch
        installs and reuse caches.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell: persistent (replaces stateless tool-bash) ───────────────────────

# The PTY registry is agent-owned, so it lives in an entry-local realm. The
# backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        maxOutputChars: 20000
        description: |-
          Run commands in a persistent bash shell inside the Docker sandbox.
          * State — current directory, exported variables, functions, and
            background jobs — persists across calls for this agent; do not
            re-`cd` or re-export.
          * `rg` (ripgrep) and `jq` are preinstalled; prefer them for search
            and JSON.
          * Run long-lived commands in the background with
            `nohup ... >/tmp/log 2>&1 &`, then check the log.
          * Avoid commands that produce very large output.
          * To inspect a line range of a file, e.g. lines 10-25:
            'sed -n 10,25p /path/to/the/file'.

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
# NOTE: the npm dist ships no HTTP fetch provider (only the DeepSeek
# web-search provider), so `fetch: false` keeps web_fetch out of the model's
# catalog instead of registering a tool that would fail with
# WEB_PROVIDER_UNAVAILABLE at call time. Re-enable (fetch: true) once a fetch
# provider is mounted (e.g. building from source).
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
